<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Test Site</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #111827;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero {
            background: linear-gradient(to right, #4f46e5, #ec4899);
            color: white;
            padding: 4rem 5%;
            text-align: center;
        }

        .content {
            padding: 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            shadow-md;
        }
    </style>
</head>

<body>
    <header>
        <h2>ShopDemo</h2>
        <nav>Products | About | Contact</nav>
    </header>
    <div class="hero">
        <h1>Welcome to our Store</h1>
        <p>This is a simulated website to test the ChatDesk embedded widget.</p>
    </div>
    <div class="content">
        <div class="card">
            <h3>Premium Audio</h3>
            <p>Explore our latest headphones.</p>
        </div>
        <div class="card">
            <h3>Smart Watches</h3>
            <p>Track your fitness today.</p>
        </div>
        <div class="card">
            <h3>Laptops</h3>
            <p>High performance machines.</p>
        </div>
    </div>

    <!-- ChatDesk Widget Embed - Replace BOT_ID with a real ID after creating it in the dashboard -->
    <script>
        (function () {
            var s = document.createElement("script");
            s.src = "https://chatbot-backend-m45w.onrender.com/widget.js";
            s.setAttribute("data-bot-id", "1"); // Testing with Bot ID 1
            document.head.appendChild(s);
        })();
    </script>
</body>

</html>
